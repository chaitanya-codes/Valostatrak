<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valostatrak - Track your stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="navbar">
                <button id="home"><img src="https://cdn.glitch.global/11a62e6a-ce75-4611-96ba-b7a1c80be123/valostatrak.png?v=1707301137557" width="68"><span>ValoStatrak</span></button>
                <ul class="list">
                    <a href="https://discord.com/oauth2/authorize?client_id=855083775460769793&permissions=139855192128&scope=bot%20applications.commands"><li>Invite Bot</li></a>
                    <a href="commands"><li>Commands</li></a>
                    <a href="https://discord.com/discovery/applications/855083775460769793"><li>About</li></a>
<!--                     <a id="login" href="https://discord.com/oauth2/authorize?client_id=855083775460769793&response_type=token&redirect_uri=https%3A%2F%2Fvalostatrak-bot.glitch.me&scope=identify"><li>Login</li></a> -->
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="sloganContainer">
            <h1 class="slogan">Valorant Statistics</h1>
            <h2 class="slogan">Simplifed.</h2>
        </div>
        <p id="info"></p>
        <span id="servercount">Server count: 10</span>

        <div class="row">
            <div class="col card">
              <h2>Top Commands (All Time)</h2>
              <canvas id="topCommands"></canvas>
            </div>
            <div class="col card">
              <h2>Daily Usage (Last 30 Days)</h2>
              <canvas id="dailyUsage"></canvas>
            </div>
        </div>
    </main>
    <footer>
        
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js" type="module"></script>

</body>
</html>
