<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valostatrak - Track your stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body bgcolor="darkblue">
    <header>
        <nav>
            <div class="navbar">
                <button id="home"><img src="https://cdn.glitch.global/11a62e6a-ce75-4611-96ba-b7a1c80be123/valostatrak.png?v=1707301137557" width="68"><span>ValoStatrak</span></button>
                <ul class="list">
                    <a href="https://discord.com/oauth2/authorize?client_id=855083775460769793&permissions=139855192128&scope=bot%20applications.commands"><li>Invite Bot</li></a>
                    <a href="/commands"><li>Commands</li></a>
                    <a href="/about"><li>About</li></a>
                    <a id="login" href="https://discord.com/oauth2/authorize?client_id=855083775460769793&response_type=token&redirect_uri=https%3A%2F%2Fvalostatrak-bot.glitch.me&scope=identify"><li>Login</li></a>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <h1 class="stop-slogan">Valorant Statistics</h1>
        <h2 class="stop-slogan">Simplifed.</h2>
        <!-- Temporarily stopped for performance -->
        <p id="info"></p>
        <span id="servercount">Server count: 10</span>
    </main>
    <footer>
        
    </footer>
    <script src="index.js" type="module"></script>
    <script>
      window.onload = () => {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const [accessToken, tokenType] = [fragment.get('access_token'), fragment.get('token_type')];

        if (!accessToken) {
          return (document.getElementById('login').style.display = 'block');
        }
        
        fetch('https://discord.com/api/users/@me', {
          headers: {
            authorization: `${tokenType} ${accessToken}`,
          }
        })
        .then(result =>console.log(result))
          // .then(result => result.json())
          .then(response => {
            const { username, discriminator } = response;
            document.getElementById('info').innerText += ` ${username}#${discriminator}`;
          })
          .catch(console.error);
      };
    </script>
</body>
</html>
